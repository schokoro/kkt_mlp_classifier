[project]
name = "kkt-mlp-classifier"
version = "0.1.0"
description = "Иерархический классификатор L1→L2→L3 (TF-IDF + sparse MLP)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "pandas>=2.1,<3",
    "pyarrow>=15,<22",
    "scikit-learn>=1.4,<1.8",
    "torch>=2.4,<3",
    "joblib>=1.3,<2",
    "matplotlib>=3.8,<4",
    "tqdm>=4.66,<5",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "nbconvert>=7,<8",
    "nbformat>=5.9,<6",
    "ipykernel>=6.29,<7",
]

[tool.uv]
# kkt_clf импортируется через sys.path (scripts, tests, notebooks) — пакет не собираем
package = false
